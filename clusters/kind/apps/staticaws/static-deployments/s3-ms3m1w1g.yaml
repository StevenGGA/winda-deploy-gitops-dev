apiVersion: batch/v1
kind: Job
metadata:
  name: "staticaws-s3-ms3m1w1g"
  labels: { app: "staticaws", workload: "static-deploy" }
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: { app: "staticaws", workload: "static-deploy" }
    spec:
      restartPolicy: Never
      initContainers:
        - name: extract-site
          image: "kind.local/winda/static-demo:v20260727191414"
          command: ["cp"]
          args: ["-a", "/site/.", "/workspace/"]
          volumeMounts:
            - { name: workspace, mountPath: "/workspace" }
      containers:
        - name: upload
          image: "public.ecr.aws/aws-cli/aws-cli:2.27.41"
          args: ["s3", "sync", "/workspace", "s3://winda-static-dev/staticaws/", "--delete", "--only-show-errors"]
          env:
            - { name: "AWS_REGION", value: "us-east-2" }
            - { name: "AWS_DEFAULT_REGION", value: "us-east-2" }
          envFrom:
            - secretRef: { name: "aws-static-credentials" }
          volumeMounts:
            - { name: workspace, mountPath: "/workspace", readOnly: true }
      volumes:
        - name: workspace
          emptyDir: {}

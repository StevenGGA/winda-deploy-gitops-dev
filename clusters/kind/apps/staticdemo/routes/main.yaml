apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "staticdemo-main"
spec:
  parentRefs:
    - { name: main-gateway, namespace: winda-deploy }
  hostnames: ["staticdemo.dev.localtest.me"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: "/" }
      backendRefs:
        - { name: "staticdemo-v1", port: 80, weight: 1 }

apiVersion: batch/v1
kind: Job
metadata:
    name: pr4-e2e-08141920-docs-fe9c78d10a
    labels:
        app: pr4-e2e-08141920
        deployment: docs
        winda.ai/workload: static-publish
    annotations:
        winda.ai/bucket: winda-deploy-static-local-dev
        winda.ai/prefix: pr4-e2e-08141920/docs/
        winda.ai/region: us-east-2
        winda.ai/tag: latest
spec:
    backoffLimit: 2
    activeDeadlineSeconds: 900
    template:
        metadata:
            labels:
                app: pr4-e2e-08141920
                deployment: docs
                winda.ai/workload: static-publish
        spec:
            restartPolicy: Never
            initContainers:
                - name: extract
                  image: winda-deploy-api:localdev
                  command:
                    - /static-extractor
                  args:
                    - ghcr.io/stevengga/winda-static-demo:latest
                    - /usr/share/nginx/html
                    - /publish
                  volumeMounts:
                    - name: publish
                      mountPath: /publish
            containers:
                - name: upload
                  image: public.ecr.aws/aws-cli/aws-cli:2.27.41@sha256:1c2d7a51b1ff4f460bc3f1e1ee46a6cef47c7429ad9089ef99012a95e472a1a5
                  args:
                    - s3
                    - sync
                    - /publish/
                    - s3://winda-deploy-static-local-dev/pr4-e2e-08141920/docs/
                    - --region
                    - us-east-2
                    - --delete
                    - --no-follow-symlinks
                    - --only-show-errors
                  envFrom:
                    - secretRef:
                        name: winda-static-s3-upload
                  volumeMounts:
                    - name: publish
                      mountPath: /publish
                      readOnly: true
            volumes:
                - name: publish
                  emptyDir: {}

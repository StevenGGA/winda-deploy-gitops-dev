    labels:
        app: pr3-cf-08131344-cf
        deployment: slot-b
        winda.ai/workload: static-publish
    annotations:
        winda.ai/bucket: winda-deploy-static-local-dev
        winda.ai/prefix: pr3-cf-08131344-cf/slot-b/
        winda.ai/region: us-east-2
        winda.ai/tag: sha-b86593d
spec:
    backoffLimit: 2
    activeDeadlineSeconds: 900
    template:
        metadata:
            labels:
                app: pr3-cf-08131344-cf
                deployment: slot-b
                winda.ai/workload: static-publish
        spec:

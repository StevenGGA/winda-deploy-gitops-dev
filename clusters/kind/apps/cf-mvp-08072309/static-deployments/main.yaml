apiVersion: batch/v1
kind: Job
metadata:
    name: cf-mvp-08072309-main-52294ee7d0
    labels:
        app: cf-mvp-08072309
        deployment: main
        winda.ai/workload: static-publish
    annotations:
        winda.ai/bucket: winda-deploy-static-local-dev
        winda.ai/prefix: cf-mvp-08072309/main/
        winda.ai/region: us-east-2
        winda.ai/tag: sha-b86593d
spec:
    backoffLimit: 2
    activeDeadlineSeconds: 900
    template:
        metadata:
            labels:
                app: cf-mvp-08072309
                deployment: main
                winda.ai/workload: static-publish
        spec:
            restartPolicy: Never
            initContainers:
                - name: extract
                  image: winda-deploy-api:localdev
                  command:
                    - /static-extractor
                  args:
                    - ghcr.io/stevengga/winda-static-demo:sha-b86593d
                    - /usr/share/nginx/html
                    - /publish
                  volumeMounts:
                    - name: publish
                      mountPath: /publish
            containers:
                - name: upload
                  image: public.ecr.aws/aws-cli/aws-cli:2.27.41@sha256:1c2d7a51b1ff4f460bc3f1e1ee46a6cef47c7429ad9089ef99012a95e472a1a5
                  args:
                    - s3
                    - sync
                    - /publish/
                    - s3://winda-deploy-static-local-dev/cf-mvp-08072309/main/
                    - --region
                    - us-east-2
                    - --delete
                    - --no-follow-symlinks
                    - --only-show-errors
                  envFrom:
                    - secretRef:
                        name: winda-static-s3
                  volumeMounts:
                    - name: publish
                      mountPath: /publish
                      readOnly: true
            volumes:
                - name: publish
                  emptyDir: {}

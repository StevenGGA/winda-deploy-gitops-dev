apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: cf-mvp-08072309-web
    labels:
        app: cf-mvp-08072309
        winda.ai/workload: static-route
    annotations:
        winda.ai/static-deployment: main
spec:
    parentRefs:
        - name: main-gateway
          namespace: winda-deploy
    hostnames:
        - cf-mvp-08072309.static-dev.winda.ai
    rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                    - name: X-Winda-Static-Prefix
                      value: cf-mvp-08072309/main/
                    - name: X-Winda-Static-Index-Document
                      value: index.html
          backendRefs:
            - name: static-proxy
              port: 8080

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "order-test-web"
  labels: { app: "order-test", staticSite: "web", workload: "static-site" }
spec:
  parentRefs:
    - { name: main-gateway, namespace: winda-deploy }
  hostnames: ["order-test-web.dev.localtest.me"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: "/" }
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - { name: "X-Winda-Static-Bucket", value: "winda-static-dev" }
              - { name: "X-Winda-Static-Prefix", value: "order-test/web" }
              - { name: "X-Winda-Static-Mode", value: "docs" }
      backendRefs:
        - { name: "static-proxy", namespace: "winda-deploy", port: 8080 }

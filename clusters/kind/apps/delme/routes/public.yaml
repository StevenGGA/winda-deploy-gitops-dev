apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: delme-public
    labels:
        app: delme
        winda.ai/workload: static-route
    annotations:
        winda.ai/static-deployment: web
spec:
    parentRefs:
        - name: main-gateway
          namespace: winda-deploy
    hostnames:
        - delme.dev.localtest.me
    rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                    - name: X-Winda-Static-Prefix
                      value: delme/web/
                    - name: X-Winda-Static-Index-Document
                      value: index.html
          backendRefs:
            - name: static-proxy
              port: 8080

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: winda-demo-08071643-web
    labels:
        app: winda-demo-08071643
        winda.ai/workload: static-route
    annotations:
        winda.ai/static-deployment: main
spec:
    parentRefs:
        - name: main-gateway
          namespace: winda-deploy
    hostnames:
        - winda-demo-08071643.dev.localtest.me
    rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                    - name: X-Winda-Static-Prefix
                      value: winda-demo-08071643/main/
                    - name: X-Winda-Static-Index-Document
                      value: index.html
          backendRefs:
            - name: static-proxy
              port: 8080

apiVersion: batch/v1
kind: Job
metadata:
  name: "manbo-s3-ms3rui4w"
  labels: { app: "manbo", workload: "static-deploy" }
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: { app: "manbo", workload: "static-deploy" }
    spec:
      restartPolicy: Never
      initContainers:
        - name: extract-site
          image: "ghcr.io/stevengga/steven-hello:latest"
          command: ["cp"]
          args: ["-a", "/site/.", "/workspace/"]
          volumeMounts:
            - { name: workspace, mountPath: "/workspace" }
      containers:
        - name: upload
          image: "public.ecr.aws/aws-cli/aws-cli:2.27.41"
          args: ["--endpoint-url", "http://minio.minio.svc.cluster.local:9000", "s3", "sync", "/workspace", "s3://winda-static-dev/manbo/", "--delete", "--only-show-errors"]
          env:
            - { name: "AWS_REGION", value: "us-east-2" }
            - { name: "AWS_DEFAULT_REGION", value: "us-east-2" }
          envFrom:
            - secretRef: { name: "aws-static-credentials" }
          volumeMounts:
            - { name: workspace, mountPath: "/workspace", readOnly: true }
      volumes:
        - name: workspace
          emptyDir: {}

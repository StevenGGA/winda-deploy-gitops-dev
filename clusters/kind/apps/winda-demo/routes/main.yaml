apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "winda-demo-main"
spec:
  parentRefs:
    - { name: main-gateway, namespace: winda-deploy }
  hostnames: ["winda-demo.dev.localtest.me"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: "/" }
      backendRefs:
        - { name: "winda-demo-v1", port: 80, weight: 100 }

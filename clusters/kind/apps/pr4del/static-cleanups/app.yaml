apiVersion: batch/v1
kind: Job
metadata:
    name: pr4del-rm-38f0a2a28a
    labels:
        app: pr4del
        winda.ai/workload: static-cleanup
    annotations:
        winda.ai/bucket: winda-deploy-static-local-dev
        winda.ai/cleanup-attempt: "1"
        winda.ai/cleanup-scope: app
        winda.ai/cleanup-stage: awaiting-edge
        winda.ai/prefix: pr4del/

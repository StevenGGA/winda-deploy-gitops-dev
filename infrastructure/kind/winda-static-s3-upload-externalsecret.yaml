# Platform infrastructure: the write-only static S3 credential for env dev.
# ESO reads the localdev upload identity from LocalStack Secrets Manager and
# materializes the Secret mounted only by static publish and cleanup Jobs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: winda-static-s3-upload
  namespace: dev
  labels: { winda.ai/platform: static-s3-upload }
  annotations: { force-sync: "2026-08-11T12:20:00-04:00" }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: winda-static-s3-upload, creationPolicy: Owner }
  data:
    - secretKey: "AWS_ACCESS_KEY_ID"
      remoteRef: { key: winda/platform/localdev/static-s3-upload, property: "AWS_ACCESS_KEY_ID" }
    - secretKey: "AWS_SECRET_ACCESS_KEY"
      remoteRef: { key: winda/platform/localdev/static-s3-upload, property: "AWS_SECRET_ACCESS_KEY" }

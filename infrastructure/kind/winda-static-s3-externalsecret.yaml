# Platform infrastructure: the static S3 credential for env dev. Value-free —
# ESO reads winda/platform/localdev/static-s3 (LocalStack in localdev) and
# materializes the dev/winda-static-s3 Secret the upload Job and static-proxy
# mount by name. Managed by hack/localdev/static-setup.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: winda-static-s3
  namespace: dev
  labels: { winda.ai/platform: static-s3 }
  annotations: { force-sync: "2fdefc64427e0f51" }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: winda-static-s3, creationPolicy: Owner }
  data:
    - secretKey: "AWS_ACCESS_KEY_ID"
      remoteRef: { key: winda/platform/localdev/static-s3, property: "AWS_ACCESS_KEY_ID" }
    - secretKey: "AWS_SECRET_ACCESS_KEY"
      remoteRef: { key: winda/platform/localdev/static-s3, property: "AWS_SECRET_ACCESS_KEY" }
